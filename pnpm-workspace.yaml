# pnpm workspace 配置
# 前后端放同一个仓库，共享 TypeScript 类型（packages/shared）
# 详见 docs/04-工程规范与目录结构.md

packages:
  - 'packages/*'
  - 'server'
  - 'miniprogram'
# pnpm 10+ 不再读 package.json 里的 pnpm 字段，构建脚本白名单必须写在这里。
# Prisma 需要执行 postinstall 生成 @prisma/client，否则 prisma:push / prisma:generate 会失败。
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
